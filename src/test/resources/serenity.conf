serenity {
  #take.screenshots = FOR_FAILURES
  take.screenshots = AFTER_EACH_STEP
}

headless.mode = false

webdriver {
    # Navegador predeterminado para ejecuciones locales.
    # Jenkins podrá reemplazarlo mediante -Dwebdriver.driver.
    driver = chrome
}

# Configuración de entornos
environments {
    production {
        webdriver.base.url = "https://www.google.com/"
        driver = "chrome"
        browser = "chrome"
    }

    certification {
        webdriver.base.url = "https://www.demoblaze.com/"
        driver = "chrome"
        browser = "chrome"
    }

    development {
        webdriver.base.url = "https://www.google.com/"
        driver = "chrome"
        browser = "chrome"
    }
}